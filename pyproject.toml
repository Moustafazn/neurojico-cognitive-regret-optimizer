[project]
name = "neurojico-cognitive-regret-optimizer"
version = "0.3.0"
description = "NCRO: A novel metaheuristic optimizer using cognitive regret and counterfactual learning. Compared against CMA-ES, L-SHADE, jSO (CEC 2017), IMODE (CEC 2020), NL-SHADE-LBC (CEC 2022), and L-SRTDE (CEC 2024)."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "python-docx>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Moustafazn/neurojico-cognitive-regret-optimizer"
